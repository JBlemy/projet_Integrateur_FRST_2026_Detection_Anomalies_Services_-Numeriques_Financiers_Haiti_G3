# ===================================================================
# CONFIGURATION DU PROJET DE DETECTION D'ANOMALIES
# ===================================================================

# Configuration des donnees
data:
  raw_path: "data/raw/indian_banking_transactions.csv"
  processed_path: "data/processed/indian_banking_transactions_clean.csv"

# Split temporel
temporal_split:
  train_ratio: 0.6
  validation_ratio: 0.2
  test_ratio: 0.2
  random_state: 42

# StandardScaler
scaler:
  fit_on_train: true

# FAMD 
famd:
  max_cardinality: 15
  n_components: 50
  n_iter: 10
  random_state: 42

# Isolation Forest 
isolation_forest:
  n_estimators: 500
  contamination: 0.01
  max_samples: 8192
  max_features: 1.0
  bootstrap: false
  random_state: 42
  n_jobs: -1

# Calibration 
threshold_calibration:
  objective: "precision_recall_curve"
  optimization_metric: "f1"
  min_recall: 0.85
  min_precision: 0.30

# Evaluation
evaluation:
  metrics: ["precision", "recall", "f1", "roc_auc", "pr_auc", "balanced_accuracy"]
  visualization: true
  production_targets:
    auc_roc: 0.90
    recall: 0.85
    precision: 0.30
    f1: 0.50
    false_positive_alert_share: 0.10