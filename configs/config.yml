# ===================================================================
# CONFIGURATION DU PROJET DE DÉTECTION D'ANOMALIES
# ===================================================================

# Configuration des données
data:
  raw_path: "data/raw/indian_banking_transactions.csv"
  processed_path: "data/processed/indian_banking_transactions_clean.csv"

# Préprocessing
preprocessing:
  scaling: "standard"
  test_size: 0.2

# Isolation Forest
isolation_forest:
  n_estimators: 100
  contamination: 0.01
  max_samples: "auto"
  random_state: 42
  bootstrap: false

# DBSCAN
dbscan:
  metric: "euclidean"
  # Les valeurs finales sont déterminées dans le notebook par les k-distances.
  min_samples_candidates: [5, 10, 15, 20]

# ACP (PCA)
pca:
  # Nombre de composantes choisi automatiquement pour conserver cette variance.
  variance_threshold: 0.99

# Évaluation
evaluation:
  metrics: ["precision", "recall", "f1", "roc_auc"]
  visualization: true
